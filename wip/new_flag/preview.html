const url=URL.createObjectURL(new Blob([bin],{type:'model/gltf+json'}));
let mixer=null;
new GLTFLoader().load(url,(g)=>{
  scene.add(g.scene);
  if(g.animations?.length){
    mixer=new THREE.AnimationMixer(g.scene);
    g.animations.forEach(c=>mixer.clipAction(c).play());
    status.textContent='OK: '+g.animations.map(a=>a.name).join(', ');
  } else status.textContent='OK без анимации';
  URL.revokeObjectURL(url);
},undefined,e=>status.textContent='Ошибка: '+e.message);
const clock=new THREE.Clock();
(function tick(){requestAnimationFrame(tick); if(mixer) mixer.update(clock.getDelta()); controls.update(); renderer.render(scene,camera);})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
